name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - List all files
        run: |
          echo "=== لیست تمام فایل‌های موجود در مخزن ==="
          find . -maxdepth 4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Find project and build APK
        run: |
          PUBSPEC_FILE=$(find . -name "pubspec.yaml" -maxdepth 4)
          if [ -z "$PUBSPEC_FILE" ]; then
            echo "Error: pubspec.yaml not found anywhere!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_FILE")
          echo "Found project in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
